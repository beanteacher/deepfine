server:
  port: 8080

spring:
  application:
    name: deepfine

  datasource:
    url: jdbc:mysql://localhost:3306/deepfine?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: deepfine
    password: deepfine
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
