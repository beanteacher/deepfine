server:
  port: 8080

spring:
  application:
    name: deepfine

  datasource:
    url: jdbc:postgresql://localhost:5432/deepfine
    username: deepfine
    password: deepfine
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
